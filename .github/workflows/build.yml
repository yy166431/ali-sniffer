name: Build AliSniffer dylib

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-13] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show runner & SDK
        run: |
          echo "Runner: $(uname -a)"
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Build (clang direct)
        run: |
          set -eux
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=11.0 -fobjc-arc \
            -dynamiclib AliSniffer.m \
            -framework Foundation -framework UIKit -framework WebKit -framework AVFoundation \
            -ObjC -o build/AliSniffer.dylib
          file build/AliSniffer.dylib
          otool -L build/AliSniffer.dylib || true

      - uses: actions/upload-artifact@v4
        with:
          name: AliSniffer_dylib
          path: build/AliSniffer.dylib
